[pytest]
python_files = ["test_*.py"]
filterwarnings = [
  "error",
  "ignore:invalid escape sequence:SyntaxWarning"]
markers = [
    "adjoint",
    "forward",
    "objective",
    "objective_gradient",
    "objective_wrapped",
]
addopts = [
    "--cov=sirf", "--cov-append",
    "-v", '-k not (PET and (test_objective_function_gradcheck or test_objective_function_gradient_gradcheck))'
]
